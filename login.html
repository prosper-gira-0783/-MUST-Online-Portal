<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUST | Online Application Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <img src="must-logo.jpeg" alt="Mbarara University of Science and Technology logo" class="must-logo">
    <div>
      <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
      <p class="subtitle">Online Application Portal</p>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Welcome Back!</h2>
      <p class="description">Log in to access your university application account.</p>
      <form action="#" method="post">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        <div class="forgot-password"><a href="#" onclick="alert('Please contact the admissions/portal support team to reset your password.'); return false;">Forgot your password?</a></div>
        <button type="submit" class="primary-button">Sign In</button>
      </form>
      <p class="signup-link">New to the portal?</p>
      <nav class="portal-buttons" aria-label="Portal options">
        <a href="register.html" class="secondary-button">Create Account</a>
        <a href="how_to_apply.html" class="secondary-button">How to Apply</a>
      </nav>
    </section>
  </main>
  <footer><p>&copy; 2026 Mbarara University of Science and Technology.</p></footer>
</body>
</html>
